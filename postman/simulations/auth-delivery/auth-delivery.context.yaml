purpose:
  stands_in_for: The deployment-owned SMS, WhatsApp, and email authentication delivery adapter.
  unblocks: Local end-to-end testing of team OTPs and password-reset flows without sending messages.
assumptions:
  - id: adapter-wire-contract
    status: supported
    claim: The Rust caller sends kind, recipient, and value as JSON to the configured adapter and accepts a 204 response in the tested local flows.
    reason: The actual Rust server completed team verification and password reset using messages captured by the local stand-in.
    verification: On 2026-11-09, tests/api_integration.py passed against isolated PostgreSQL and the Postman simulation. Simulation request events recorded POST /messages with 204 responses; the tests consumed the captured OTP and reset token and verified single use and session revocation.
    source: src/auth/admin.rs; postman/mocks/auth-delivery/default.js; tests/api_integration.py
    updated_at: "2026-11-09"
