    status: unknown
    claim: The production adapter delivers messages to SMS, WhatsApp, or email recipients.
    reason: No production provider or credentials were supplied. The stand-in implements the contract introduced by this repository; an owner-mock search was skipped because the CLI was signed out and there is no identified external provider.
    verification: Only the local HTTP adapter flow was exercised. Configure and validate the actual provider before enabling production recovery and team sign-in.
    source: README.md authentication delivery adapter; .env.example
    updated_at: "2026-11-09"
